name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# One run per branch/PR. In-flight PR runs are cancelled when new commits land;
# main runs are left alone so the release bundle for every merged commit completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

jobs:
  static-analysis:
    name: Static analysis (ktlint / detekt / lint)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-android

      # --continue so a ktlint failure still lets detekt and lint report their findings.
      - name: ktlint, detekt, Android Lint
        run: ./gradlew --continue :app:ktlintCheck :app:detekt :app:lintDebug

      - name: Upload analysis reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: static-analysis-reports
          path: |
            app/build/reports/ktlint/**
            app/build/reports/detekt/**
            app/build/reports/lint-results-*.*
          if-no-files-found: ignore
          retention-days: 14

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-android

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  assemble-debug:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Compiles the JNI wrapper against the on-device engine, so this job needs the NDK.
      - uses: ./.github/actions/setup-android
        with:
          native: 'true'

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  release-bundle:
    name: Release bundle (AAB)
    # main only: PRs stop at the three jobs above.
    if: github.event_name != 'pull_request'
    needs: [static-analysis, unit-test, assemble-debug]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-android
        with:
          native: 'true'

      # No release signingConfig is defined yet, so this produces an UNSIGNED bundle.
      - name: Bundle release
        run: ./gradlew :app:bundleRelease

      - name: Upload release bundle
        uses: actions/upload-artifact@v7
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
