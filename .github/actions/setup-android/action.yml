name: Setup Android build
description: >
  Installs JDK 21 (required by gradle/gradle-daemon-jvm.properties), the Android SDK
  packages this project builds against, and Gradle with dependency/wrapper caching.

inputs:
  native:
    description: >
      Install the NDK and CMake as well. Only the jobs that actually compile the JNI
      wrapper need them (assembleDebug, bundleRelease) — ktlint, detekt, lint and unit
      tests do not reach externalNativeBuild, and the NDK is a ~1GB download.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '21'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
      with:
        # compileSdk = 37 (app/build.gradle.kts); build-tools 36.0.0 is AGP 9.3.2's default.
        # The NDK/CMake versions must match app/build.gradle.kts and CMakeLists.txt.
        packages: >-
          platform-tools platforms;android-37.0 build-tools;36.0.0
          ${{ inputs.native == 'true' && 'ndk;28.2.13676358 cmake;3.22.1' || '' }}

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        # Caches ~/.gradle/caches and the wrapper distribution. The cache is written
        # only from the default branch and read on PRs, so PRs can't poison it.
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
        # Set the GRADLE_ENCRYPTION_KEY repo secret to also cache the Gradle
        # configuration cache (org.gradle.configuration-cache=true is on for this project).
        cache-encryption-key: ${{ env.GRADLE_ENCRYPTION_KEY }}
