# Overrides layered on top of detekt's default config (buildUponDefaultConfig = true).
# Only deviations from the defaults belong here.

naming:
  FunctionNaming:
    # Jetpack Compose @Composable functions are PascalCase by convention.
    ignoreAnnotated: ['Composable']
  MatchingDeclarationName:
    # 컴포넌트 파일의 주 선언은 @Composable 함수이고, variant enum은 그 함수에 딸린
    # 값이다. 규칙은 클래스 선언만 세므로 Avatar.kt가 MedicalMateAvatarType.kt여야
    # 한다고 본다. 파일명을 enum에 맞추면 컴포넌트를 이름으로 찾을 수 없다.
    # enum을 별도 파일로 빼는 방법도 있지만 variant와 컴포넌트가 갈린다.
    excludes: ['**/core/designsystem/component/**']

style:
  UnusedPrivateMember:
    # @Preview 컴포저블은 코드에서 호출되지 않고 IDE·툴링이 실행한다.
    # 미사용이 아니라 호출자가 코드 밖에 있는 경우다.
    ignoreAnnotated: ['Preview']
  MagicNumber:
    # Compose 레이아웃 코드의 dp·sp 리터럴까지 잡으면 신호 대비 잡음이 너무 크다.
    # 비즈니스 로직(data·ViewModel 계산)에서는 그대로 살아 있다.
    excludes: ['**/test/**', '**/androidTest/**', '**/core/designsystem/**', '**/ui/**']
  WildcardImport:
    excludes: ['**/test/**', '**/androidTest/**']

complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
