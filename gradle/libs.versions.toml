[versions]
agp = "9.3.2"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.2.10"
# navigation-compose 2.10.0이 Compose 1.10.5를 요구한다. 2026.02.01은 1.10.4를 고정해
# ui·runtime·animation만 1.10.5로 올라가고 나머지는 1.10.4에 남는다. 버전을 맞추려고 올렸다.
composeBom = "2026.03.00"
detekt = "1.23.8"
ktlint = "14.2.0"
# KSP 버전은 Kotlin 버전에 묶여 있습니다. kotlin을 올리면 여기도 함께 올립니다.
ksp = "2.2.10-2.0.2"
kakao = "2.25.0"
# 음성 인식. **알파다.** 정식판이 나오면 올린다. API 31 미만과 AICore를 못 쓰는 기기에서는
# 동작하지 않고, 그 기기에서는 앱이 마이크를 그리지 않는다.
mlkitGenaiSpeech = "1.0.0-alpha1"
androidxHilt = "1.4.0"
desugarJdkLibs = "2.1.5"
retrofit = "3.0.0"
okhttp = "5.5.0"
# 1.11.0은 kotlin-stdlib 2.3.20을 요구해 Kotlin 2.2.10 컴파일러가 읽지 못한다.
# kotlin을 올릴 때 함께 재검토한다.
kotlinxSerialization = "1.9.0"
# Compose BOM이 끌어오는 coroutines 버전과 맞춘 값이다. BOM이 바뀌면 함께 본다.
kotlinxCoroutines = "1.9.0"
# 타입 세이프 라우트는 kotlinx-serialization-core 1.7.3 이상을 요구한다. 위의 1.9.0으로 충족된다.
navigation = "2.10.0"
datastore = "1.2.1"
hilt = "2.60.1"
# 3D 인체도(#211)를 그리는 렌더러. gltfio가 GLB를 읽고 Draco 압축을 푼다.
filament = "1.75.1"
# 온디바이스 엔진. AI 트랙이 llama.cpp 업스트림을 Snapdragon 툴체인으로 빌드해 릴리즈로 넘긴
# 산출물이다(`Medical-Mate/AI`의 릴리즈 태그). 앱이 직접 빌드하지 않는다. 도커 툴체인이 필요한데
# 이 개발 환경에 없다. 바뀌면 AI 쪽이 태그를 올려 다시 전달한다.
onDeviceEngine = "pkg-android-2092353"
onDeviceEngineSha256 = "0611e4eca75f0bfde900d7cd937ecf8e80edd0820a5fe2a068cd5b568d334545"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
# collectAsStateWithLifecycle()
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
# Maven Central에 없다. settings.gradle.kts의 devrepo.kakao.com에서 받는다.
kakao-user = { group = "com.kakao.sdk", name = "v2-user", version.ref = "kakao" }
# 기기 안에서 도는 음성 인식. 오디오가 기기 밖으로 나가지 않는다.
mlkit-genai-speech = { group = "com.google.mlkit", name = "genai-speech-recognition", version.ref = "mlkitGenaiSpeech" }
# hiltViewModel(). hilt-navigation-compose의 같은 함수는 deprecated다.
androidx-hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "androidxHilt" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
# minSdk 24에서 java.time을 쓰기 위한 core library desugaring
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
filament-android = { group = "com.google.android.filament", name = "filament-android", version.ref = "filament" }
# GLB 로더. Filament 네이티브 라이브러리도 함께 올린다.
filament-gltfio = { group = "com.google.android.filament", name = "gltfio-android", version.ref = "filament" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

